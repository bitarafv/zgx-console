name: Verify Contract production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Cloudflare Access and Contract app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/verify-contract-production.test.mjs
      - run: node scripts/verify-contract-production.mjs
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
